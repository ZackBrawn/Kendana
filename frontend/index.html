<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kendana</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Kendana - Aplikasi Pencatat Keuangan" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-slate-100 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    // Register service worker only in production build to avoid caching extension/dev-scripts in dev server
    if (import.meta.env.PROD && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('PWA ServiceWorker registered:', reg.scope);
        }).catch(err => console.error('PWA ServiceWorker registration failed:', err));
      });
    } else if (!import.meta.env.PROD && 'serviceWorker' in navigator) {
      // In development, attempt to unregister any previously registered service workers
      // and clear caches to avoid SW intercepting extension requests (chrome-extension://)
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => {
          try { r.unregister(); } catch (e) { console.warn('SW unregister failed', e); }
        });
      }).catch(() => {});

      if (window.caches && typeof window.caches.keys === 'function') {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});
      }
    }
  </script>
</body>

</html>
