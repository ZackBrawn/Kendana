services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kendana
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD password .env}
      POSTGRES_DB: kendana
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kendana -d kendana"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://kendana:${DB_PASSWORD}@db:5432/kendana
      NODE_ENV: production
    volumes:
      - uploads:/app/backend/uploads
    ports:
      - "${APP_PORT:-80}:3000"

volumes:
  pgdata:
  uploads:
